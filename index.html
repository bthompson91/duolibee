<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>DUOLIBEE — Learn Tagalog</title><link rel='stylesheet' href='styles.css?v=0.5.4'><link rel='stylesheet' href='styles-v04.css?v=0.5.4'><link rel='stylesheet' href='voice.css?v=0.5.4'></head><body><header class='topbar'><button class='brand' onclick='continueHome()'><span>🐝</span><span>DUOLIBEE</span><span class='ver'>v0.6.7</span></button><div class='stats'><button class='stat' onclick='go("home");setInbox("new")'>📥 Inbox</button><button class='stat' onclick='go("home");setInbox("overdue")'>⏰ Overdue</button></div></header><nav class='tabs'><button id='tab-home' class='tab active' onclick='continueHome()'>🏠 Home</button><button id='tab-practice' class='tab' onclick='go("practice")'>🔁 Practice</button><button id='tab-profile' class='tab' onclick='go("profile")'>👤 Profile</button><button id='tab-settings' class='tab' onclick='go("settings")'>⚙️ Settings</button></nav><main id='app'><section class='card'><h1>Loading DUOLIBEE…</h1></section></main><footer>DUOLIBEE v0.6.7 • Progress stays in this browser</footer><script src='pronunciation.js?v=0.6.7'></script><script src='app.js?v=0.6.7'></script><script src='speech-routing.js?v=0.6.7'></script><script src='learning-flow.js?v=0.6.7'></script><script src='category-generator.js?v=0.6.7'></script><script>(()=>{const originalExercise=renderExercise;renderExercise=function(){originalExercise();if(session.exercises[index].type==='audio')app.querySelectorAll('.pron-guide').forEach(el=>el.remove());};function shuffled(values){const a=values.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function practice(pool){if(!pool.length)return;const picked=shuffled(pool).slice(0,10),first=Math.random()<.5;session={id:'review',icon:'🔁',title:'Mixed vocabulary practice',items:picked.map(x=>x.item),reviewKeys:picked.map(x=>x.key),results:[],exercises:picked.map((x,i)=>{const toTagalog=(i%2===0)===first,it=x.item,field=toTagalog?'t':'e',answer=it[field];const wrong=[...new Set(ALL.filter(y=>y.t!==it.t&&y.e!==it.e).map(y=>y[field]))].filter(y=>y!==answer);const options=shuffled([answer,...shuffled(wrong).slice(0,3)]);return{type:'choice',prompt:toTagalog?'Select the Tagalog for: '+it.e:'Select the English for: '+it.t,options,answer:options.indexOf(answer)};})};index=0;correct=0;renderExercise();}startReview=function(){practice(inboxItems().overdue);};const originalPractice=renderPractice;renderPractice=function(){originalPractice();document.getElementById('practice-all').onclick=()=>practice(Object.entries(ITEM_BY_KEY).map(([key,item])=>({key,item})));const note=app.querySelector('.card p:last-child');if(note)note.textContent='Practice up to 10 items, mixing English → Tagalog and Tagalog → English.';};function labels(){document.querySelectorAll('button').forEach(b=>{if(b.textContent.trim()==='Continue')b.textContent='Tuloy';});}labels();new MutationObserver(labels).observe(document.body,{childList:true,subtree:true,characterData:true});})();</script><style>.brand .ver{font-size:11px;font-weight:700;background:#58cc02;color:#fff;padding:2px 7px;border-radius:999px;margin-left:4px}.pron-guide{font-size:12px;opacity:.65;margin-top:2px}.speak-btn.slow{margin-left:4px}.theme-header{display:flex;width:100%;justify-content:space-between;padding:14px;margin:10px 0;border-radius:12px;background:transparent;color:inherit;border:1px solid #888;white-space:normal;text-align:left}.lesson-btn.locked{opacity:.5}.lesson-btn.current{border-color:#58cc02}</style></body></html>
