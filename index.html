cript>(()=>{function unlocked(){const next=nextLesson(),items=new Map();LESSONS.filter(l=>state.completed[l.id]||l===next).forEach(l=>l.items.forEach(item=>{const key=srsKey(l.category,item.t);items.set(key,{key,item});}));Object.entries(state.challengeWords||{}).forEach(([key,item])=>{ITEM_BY_KEY[key]=item;items.set(key,{key,item});});return [...items.values()];}function due(){return unlocked().filter(x=>state.srs[x.key]&&Number(state.srs[x.key].due)<=Date.now());}function header(){const el=document.querySelector('.stats');if(el)el.innerHTML="<button class='stat' onclick='go(\"practice\")'>⏰ Ready for review "+due().length+"</button>";}const tabs=renderTabs;renderTabs=function(){tabs();header();};const home=renderHome;renderHome=function(){home();app.querySelectorAll('.card').forEach(card=>{const h=card.querySelector('h2');if(h&&h.textContent.includes('Learning Inbox'))card.remove();});header();};const originalNext=next;next=function(){originalNext();header();};const originalExercise=renderExercise;renderExercise=function(){originalExercise();if(session.exercises[index].type==='audio')app.querySelectorAll('.pron-guide').forEach(el=>el.remove());const answer=document.getElementById('answer');if(answer)answer.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();answerTranslate();}});};function shuffled(values){const a=values.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function practice(pool){if(!pool.length)return;const allowed=unlocked().map(x=>x.item),picked=shuffled(pool).slice(0,10),first=Math.random()<.5;session={id:'review',icon:'🔁',title:'Mixed vocabulary practice',items:picked.map(x=>x.item),reviewKeys:picked.map(x=>x.key),results:[],exercises:picked.map((x,i)=>{const toTagalog=(i%2===0)===first,it=x.item,field=toTagalog?'t':'e',answer=it[field];const wrong=[...new Set(allowed.filter(y=>y.t!==it.t&&y.e!==it.e).map(y=>y[field]))].filter(y=>y!==answer);const options=shuffled([answer,...shuffled(wrong).slice(0,3)]);return{type:'choice',prompt:toTagalog?'Select the Tagalog for: '+it.e:'Select the English for: '+it.t,options,answer:options.indexOf(answer)};})};index=0;correct=0;renderExercise();}startReview=function(){practice(due());};renderPractice=function(){const all=unlocked(),ready=due();app.innerHTML="<section class='card'><h2>🔁 Practice</h2><p>"+all.length+" available vocabulary items • "+ready.length+" ready for review</p><button class='primary' id='practice-all' "+(all.length?'':'disabled')+">Practice everything</button><button class='primary' onclick='startReview()' "+(ready.length?'':'disabled')+">Ready for review ("+ready.length+")</button><p>Practice up to 10 items from completed lessons, the currently unlocked next lesson, and answered Daily Challenge words. Questions mix English → Tagalog and Tagalog → English. Answer choices use only this available vocabulary.</p></section>";document.getElementById('practice-all').onclick=()=>practice(unlocked());header();};function labels(){document.querySelectorAll('button').forEach(b=>{if(b.textContent.trim()==='Continue')b.textContent='Tuloy';});}labels();new MutationObserver(labels).observe(document.body,{childList:true,subtree:true,characterData:true});if(LESSONS.length){if(view==='home')renderHome();else if(view==='practice')renderPractice();else header();}})();</script><style>.brand .ver{font-size:11px;font-weight:700;background:#58cc02;color:#fff;padding:2px 7px;border-radius:999px;margin-left:4px}.pron-guide{font-size:12px;opacity:.65;margin-top:2px}.speak-btn.slow{margin-left:4px}.theme-header{display:flex;width:100%;justify-content:space-between;padding:14px;margin:10px 0;border-radius:12px;background:transparent;color:inherit;border:1px solid #888;white-space:normal;text-align:left}.lesson-btn.locked{opacity:.5}.lesson-btn.current{border-color:#58cc02}.kofi-wrap{display:flex;justify-content:center;width:100%;max-width:50%;margin:18px auto 0}@media (max-width:700px){
