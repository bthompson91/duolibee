<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUOLIBEE — Learn Tagalog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" onclick="go('learn')" aria-label="DUOLIBEE home"><span class="brand-mascot mascot-frame mini"><img src="assets/mascot-welcome.png" alt="DUOLIBEE mascot" onerror="mascotFallback(this)"><span class="mascot-emoji">🐝</span></span><span>DUOLIBEE</span></button>
    <div class="stats">
      <button class="stat" onclick="go('profile')" title="Streak">🔥 <span id="streak">0</span></button>
      <button class="stat" onclick="go('profile')" title="Gems">💎 <span id="gems">0</span></button>
      <button class="stat" id="hearts-stat" onclick="go('profile')" title="Hearts">❤️ <span id="hearts">5</span></button>
      <button class="stat" id="boost-stat" onclick="go('profile')" title="XP Boost" style="display:none">⚡ <span id="boost">2x</span></button>
    </div>
  </header>
  <nav class="tabs">
    <button id="tab-learn" class="tab active" onclick="go('learn')">🏠 Learn</button>
    <button id="tab-practice" class="tab" onclick="go('practice')">🔁 Practice</button>
    <button id="tab-quests" class="tab" onclick="go('quests')">🎯 Quests</button>
    <button id="tab-profile" class="tab" onclick="go('profile')">👤 Profile</button>
    <button id="tab-settings" class="tab" onclick="go('settings')">⚙️ Settings</button>
  </nav>
  <main id="app"></main><div id="confetti"></div>
  <footer>DUOLIBEE • Learn Tagalog offline • Progress stays in this browser</footer>
  <script src="lessons.js"></script><script src="extra.js"></script><script src="app.js"></script>
</body>
</html>
