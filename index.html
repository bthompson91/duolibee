<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUOLIBEE — Learn Tagalog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="bee">🐝</span> DUOLIBEE</div>

    </div>
  </header>

  <main id="app"></main>

  <footer>Made for Tagalog learners • Progress is stored locally in your browser</footer>
  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
