<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUOLIBEE — Learn Tagalog</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="voice.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" onclick="go('learn')" aria-label="DUOLIBEE home"><span class="brand-mascot mascot-frame mini"><img src="assets/mascot-welcome.png" alt="DUOLIBEE mascot" onerror="mascotFallback(this)"><span class="mascot-emoji">🐝</span></span><span>DUOLIBEE</span></button>
    <div class="stats">
      <button class="stat" onclick="go('profile')" title="Streak">🔥 <span id="streak">0</span></button>
      <button class="stat" onclick="go('profile')" title="Gems">💎 <span id="gems">0</span></button>
      <button class="stat" id="hearts-stat" onclick="go('profile')" title="Hearts">❤️ <span id="hearts">5</span></button>
      <button class="stat" id="boost-stat" onclick="go('profile')" title="XP Boost" style="display:none">⚡ <span id="boost">2x</span></button>
    </div>
  </header>
  <nav class="tabs">
    <button id="tab-learn" class="tab active" onclick="go('learn')">🏠 Learn</button>
    <button id="tab-practice" class="tab" onclick="go('practice')">🔁 Practice</button>
    <button id="tab-quests" class="tab" onclick="go('quests')">🎯 Quests</button>
    <button id="tab-profile" class="tab" onclick="go('profile')">👤 Profile</button>
    <button id="tab-settings" class="tab" onclick="go('settings')">⚙️ Settings</button>
  </nav>
  <main id="app"></main><div id="confetti"></div>
  <footer>DUOLIBEE v0.2 • Learn Tagalog offline • Progress stays in this browser</footer>
  <script src="lessons.js"></script><script src="extra.js"></script><script src="pronunciation.js"></script><script src="app.js"></script>
  <script>
  setTimeout(function(){
    var app=document.getElementById('app');
    if(app && !app.innerHTML.trim()){
      var missing=[];
      if(typeof LESSONS==='undefined'||typeof UNITS==='undefined')missing.push('lessons.js');
      if(typeof shuffle==='undefined'||typeof makeListening==='undefined')missing.push('extra.js');
      if(typeof findTagalogVoice==='undefined'||typeof tagalogSpeechText==='undefined')missing.push('pronunciation.js');
      if(typeof go==='undefined'||typeof renderLearn==='undefined')missing.push('app.js');
      var detail=missing.length?('Missing or failed: '+missing.join(', ')):'A script error stopped DUOLIBEE before it could render.';
      app.innerHTML='<section class="card"><h2>⚠️ DUOLIBEE could not start</h2><p>'+detail+'</p><p>Hard-refresh this page. If you added DUOLIBEE to your home screen, remove and re-add it to clear the older cached files.</p></section>';
    }
  },1500);
  </script>
</body>
</html>
